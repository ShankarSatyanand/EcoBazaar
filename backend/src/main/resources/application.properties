spring.application.name=ecobazaar

spring.datasource.url=jdbc:mysql://localhost:3306/ecobazaar
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (Externalized to JWT_SECRET, min 32 chars / 256 bits)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# Initial Admin User Configuration (Optional environment-driven seeding)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}